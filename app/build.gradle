plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.todo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.todo.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Voor eigen gebruik: release ook met de debug-sleutel ondertekenen
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
